# Version: v1.0
name: 'Tag Package'
description: 'Adds a tag to a DBmaestro package (Linux/bash)'
inputs:
  agent_jar_path:
    description: 'Path to DBmaestro Agent JAR file'
    required: true
  auth_type:
    description: 'DBmaestro authentication type'
    required: false
    default: 'DBmaestroAccount'
  dbmaestro_password:
    description: 'DBmaestro password'
    required: true
  dbmaestro_user:
    description: 'DBmaestro username'
    required: true
  dbmaestro_server:
    description: 'DBmaestro server URL'
    required: true
  package_name:
    description: 'Package name to tag'
    required: true
  project_name:
    description: 'DBmaestro project name'
    required: true
  tag_name:
    description: 'Tag name/value to apply'
    required: true
  tag_type_name:
    description: 'Tag type name'
    required: false
    default: 'Task'
  use_ssl:
    description: 'Use SSL for DBmaestro connection'
    required: false
    default: 'True'
runs:
  using: 'composite'
  steps:
    - name: Checkout dbmaestro-cicd repository
      uses: actions/checkout@v6
      with:
        repository: DBMaestroDev/dbmaestro-cicd
        path: dbmaestro-cicd
        ref: v1

    - name: Tag Package
      shell: bash
      env:
        DBMAESTRO_PACKAGE_NAME: ${{ inputs.package_name }}
        DBMAESTRO_TAG_TYPE_NAME: ${{ inputs.tag_type_name }}
        DBMAESTRO_TAG_NAME: ${{ inputs.tag_name }}
        DBMAESTRO_PROJECT_NAME: ${{ inputs.project_name }}
        DBMAESTRO_AGENT_JAR: ${{ inputs.agent_jar_path }}
        DBMAESTRO_SERVER: ${{ inputs.dbmaestro_server }}
        DBMAESTRO_USER: ${{ inputs.dbmaestro_user }}
        DBMAESTRO_PASSWORD: ${{ inputs.dbmaestro_password }}
        DBMAESTRO_USE_SSL: ${{ inputs.use_ssl }}
        DBMAESTRO_AUTH_TYPE: ${{ inputs.auth_type }}
      run: bash "$GITHUB_WORKSPACE/dbmaestro-cicd/core/scripts/sh/tag-package.sh"
