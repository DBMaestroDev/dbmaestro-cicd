# Version: v1.8
name: 'Get DBmaestro CLI JAR'
description: 'Downloads the DBmaestro Agent JAR file from GitHub releases'
inputs:
  version:
    description: 'Version of the DBmaestro Agent JAR to download (e.g., 26.1.0.13224)'
    required: true
  jar-path:
    description: 'Path where the JAR file will be saved (including filename, e.g., ./DBmaestroAgent.jar)'
    required: true
outputs:
  jar-file:
    description: 'Path to the downloaded JAR file'
    value: ${{ inputs.jar-path }}
  download-success:
    description: 'Whether the download was successful'
    value: ${{ steps.result.outputs.download_success }}
runs:
  using: 'composite'
  steps:
    - name: Cache DBmaestro JAR
      id: cache-jar
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/dbm-cache/DBmaestroAgent-${{ inputs.version }}.jar
        key: dbmaestro-jar-${{ inputs.version }}

    - name: Copy JAR from cache to target path
      if: steps.cache-jar.outputs.cache-hit == 'true'
      shell: bash
      run: |
        mkdir -p "$(dirname "${{ inputs.jar-path }}")"
        cp "${{ github.workspace }}/dbm-cache/DBmaestroAgent-${{ inputs.version }}.jar" "${{ inputs.jar-path }}"

    - name: Checkout dbmaestro-cicd repository
      if: steps.cache-jar.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: DBMaestroDev/dbmaestro-cicd
        path: dbmaestro-cicd
        ref: v1

    - name: Download DBmaestro Agent JAR
      id: download
      if: steps.cache-jar.outputs.cache-hit != 'true'
      shell: bash
      env:
        DBMAESTRO_VERSION: ${{ inputs.version }}
        DBMAESTRO_JAR_PATH: ${{ inputs.jar-path }}
      run: |
        export DBM_OUTPUT_FILE="$GITHUB_OUTPUT"
        bash "$GITHUB_WORKSPACE/dbmaestro-cicd/core/scripts/sh/get-cli-jar.sh"

    - name: Stage JAR for cache
      if: steps.cache-jar.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/dbm-cache"
        cp "${{ inputs.jar-path }}" "${{ github.workspace }}/dbm-cache/DBmaestroAgent-${{ inputs.version }}.jar"

    - name: Set result output
      id: result
      shell: bash
      run: echo "download_success=true" >> $GITHUB_OUTPUT
