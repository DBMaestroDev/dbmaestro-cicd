# Version: v1.8
name: 'Get DBmaestro CLI JAR'
description: 'Downloads the DBmaestro Agent JAR file from GitHub releases (PowerShell/Windows)'
inputs:
  version:
    description: 'Version of the DBmaestro Agent JAR to download (e.g., 26.1.0.13224)'
    required: true
  jar-path:
    description: 'Path where the JAR file will be saved (including filename, e.g., .\DBmaestroAgent.jar)'
    required: true
outputs:
  jar-file:
    description: 'Path to the downloaded JAR file'
    value: ${{ inputs.jar-path }}
  download-success:
    description: 'Whether the download was successful'
    value: ${{ steps.result.outputs.download_success }}
runs:
  using: 'composite'
  steps:
    - name: Cache DBmaestro JAR
      id: cache-jar
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/dbm-cache/DBmaestroAgent-${{ inputs.version }}.jar
        key: dbmaestro-jar-${{ inputs.version }}

    - name: Copy JAR from cache to target path
      if: steps.cache-jar.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        $dir = Split-Path "${{ inputs.jar-path }}" -Parent
        if ($dir) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
        Copy-Item "${{ github.workspace }}/dbm-cache/DBmaestroAgent-${{ inputs.version }}.jar" "${{ inputs.jar-path }}"

    - name: Checkout dbmaestro-cicd repository
      if: steps.cache-jar.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: DBMaestroDev/dbmaestro-cicd
        path: dbmaestro-cicd
        ref: v1

    - name: Download DBmaestro Agent JAR
      id: download
      if: steps.cache-jar.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        DBMAESTRO_VERSION: ${{ inputs.version }}
        DBMAESTRO_JAR_PATH: ${{ inputs.jar-path }}
      run: |
        $env:DBM_OUTPUT_FILE = $env:GITHUB_OUTPUT
        & "$env:GITHUB_WORKSPACE/dbmaestro-cicd/core/scripts/ps/get-cli-jar.ps1"

    - name: Stage JAR for cache
      if: steps.cache-jar.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/dbm-cache" | Out-Null
        Copy-Item "${{ inputs.jar-path }}" "${{ github.workspace }}/dbm-cache/DBmaestroAgent-${{ inputs.version }}.jar"

    - name: Set result output
      id: result
      shell: pwsh
      run: echo "download_success=true" >> $env:GITHUB_OUTPUT
