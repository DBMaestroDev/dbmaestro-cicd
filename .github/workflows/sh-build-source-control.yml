# Version: v1.10
# Reusable Workflow: Build Package from Source Control
# This workflow builds a DBmaestro package from source control (Tasks or Specific Commit)
# and validates it with precheck

name: Build from Source Control - sh (Reusable)

on:
  workflow_call:
    inputs:
      additional_information:
        description: 'Tasks list (comma-separated) or specific commit hash'
        required: false
        type: string
        default: ''
      agent_jar_path:
        description: 'Path to DBmaestro Agent JAR file'
        required: false
        type: string
        default: '/home/runner/DBmaestroAgent.jar'
      auth_type:
        description: 'Authentication type'
        required: false
        type: string
        default: 'DBmaestroAccount'
      dbmaestro_server:
        description: 'DBmaestro server URL'
        required: true
        type: string
      dbmaestro_user:
        description: 'DBmaestro username'
        required: true
        type: string
      environment-name:
        description: 'Development environment name'
        required: false
        type: string
        default: 'Dev_Env_1'
      package_name:
        description: 'Name of the package to build'
        required: true
        type: string
      project_name:
        description: 'DBmaestro project name'
        required: true
        type: string
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'dbmaestro-runner'
      use_ssl:
        description: 'Use SSL for DBmaestro connection'
        required: false
        type: string
        default: 'True'
      version_type:
        description: 'Version type: Tasks, Specific Commit, or empty'
        required: false
        type: string
        default: ''
      create_downgrade_scripts:
        description: 'Create downgrade scripts (True/False)'
        required: false
        type: string
        default: 'True'
      tags:
        description: 'Comma-separated list of tags to apply after build'
        required: false
        type: string
        default: ''
      tag_type_name:
        description: 'Tag type name'
        required: false
        type: string
        default: 'Task'
    secrets:
      DBMAESTRO_PASSWORD:
        description: 'DBmaestro password'
        required: true

jobs:
  build_package:
    name: Build Package
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Build Package Summary
        shell: bash
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## :package: Source Control Build Summary

          | Property | Value |
          |----------|-------|
          | **Package Name** | ${{ inputs.package_name }} |
          | **Project Name** | ${{ inputs.project_name }} |
          | **Environment** | ${{ inputs.environment-name }} |
          | **Version Type** | ${{ inputs.version_type }} |
          | **Additional Info** | ${{ inputs.additional_information }} |
          EOF

      - name: Build from Source Control
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/build-from-source-control@v1
        with:
          package_name: ${{ inputs.package_name }}
          project_name: ${{ inputs.project_name }}
          environment-name: ${{ inputs.environment-name }}
          version_type: ${{ inputs.version_type }}
          additional_information: ${{ inputs.additional_information }}
          agent_jar_path: ${{ inputs.agent_jar_path }}
          dbmaestro_server: ${{ inputs.dbmaestro_server }}
          use_ssl: ${{ inputs.use_ssl }}
          auth_type: ${{ inputs.auth_type }}
          dbmaestro_user: ${{ inputs.dbmaestro_user }}
          dbmaestro_password: ${{ secrets.DBMAESTRO_PASSWORD }}
          create_downgrade_scripts: ${{ inputs.create_downgrade_scripts }}

  precheck_package:
    name: Validate Package
    runs-on: ${{ inputs.runner }}
    needs: build_package
    steps:
      - name: Precheck Package
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/precheck-package@v1
        with:
          package_name: ${{ inputs.package_name }}
          project_name: ${{ inputs.project_name }}
          agent_jar_path: ${{ inputs.agent_jar_path }}
          dbmaestro_server: ${{ inputs.dbmaestro_server }}
          use_ssl: ${{ inputs.use_ssl }}
          auth_type: ${{ inputs.auth_type }}
          dbmaestro_user: ${{ inputs.dbmaestro_user }}
          dbmaestro_password: ${{ secrets.DBMAESTRO_PASSWORD }}

  tag_packages:
    name: Tag Packages
    runs-on: ${{ inputs.runner }}
    needs: precheck_package
    if: ${{ inputs.tags != '' }}
    steps:
      - name: Checkout dbmaestro-cicd
        uses: actions/checkout@v6
        with:
          repository: DBMaestroDev/dbmaestro-cicd
          ref: v1
          path: dbmaestro-cicd

      - name: Apply Tags
        shell: bash
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ inputs.package_name }}
          DBMAESTRO_TAG_TYPE_NAME: ${{ inputs.tag_type_name }}
          DBMAESTRO_PROJECT_NAME: ${{ inputs.project_name }}
          DBMAESTRO_AGENT_JAR: ${{ inputs.agent_jar_path }}
          DBMAESTRO_SERVER: ${{ inputs.dbmaestro_server }}
          DBMAESTRO_USER: ${{ inputs.dbmaestro_user }}
          DBMAESTRO_PASSWORD: ${{ secrets.DBMAESTRO_PASSWORD }}
          DBMAESTRO_USE_SSL: ${{ inputs.use_ssl }}
          DBMAESTRO_AUTH_TYPE: ${{ inputs.auth_type }}
        run: |
          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [ -z "$tag" ] && continue
            DBMAESTRO_TAG_NAME="$tag" bash "$GITHUB_WORKSPACE/dbmaestro-cicd/core/scripts/sh/tag-package.sh"
          done
