# Version: v1.11
# Reusable workflow for building and validating DBmaestro packages
# Can be called from other workflows with different configurations
# Accepts a list of packages to build and validate

name: Build and Validate Packages - sh (Reusable)

on:
  workflow_call:
    inputs:
      agent_jar_path:
        description: 'Path to DBmaestro agent JAR file'
        required: false
        type: string
        default: '/home/runner/DBmaestroAgent.jar'
      auth_type:
        description: 'Authentication type'
        required: false
        type: string
        default: 'DBmaestroAccount'
      dbmaestro_server:
        description: 'DBmaestro server hostname'
        required: true
        type: string
      dbmaestro_user:
        description: 'DBmaestro username'
        required: false
        type: string
        default: ''
      access_token_file_path:
        description: 'Path to a file containing a DBmaestro access token (alternative to dbmaestro_user/DBMAESTRO_PASSWORD)'
        required: false
        type: string
        default: ''
      package_type:
        description: 'Package type (Regular or AdHoc)'
        required: false
        type: string
        default: 'Regular'
      packages_folder:
        description: 'Root folder containing packages'
        required: false
        type: string
        default: 'packages'
      packages_matrix:
        description: 'JSON array of packages to build (e.g., [{"package":"V15"},{"package":"V16"}])'
        required: true
        type: string
      project_name:
        description: 'DBmaestro project name'
        required: true
        type: string
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'dbmaestro-runner'
      use_ssl:
        description: 'Use SSL for DBmaestro connection'
        required: false
        type: string
        default: 'True'
      tags:
        description: 'Comma-separated list of tags to apply after build'
        required: false
        type: string
        default: ''
      tag_type_name:
        description: 'Tag type name'
        required: false
        type: string
        default: 'Task'
      cli_version:
        description: 'DBmaestro CLI version to download (e.g., "26.1.0.13224"). When set, the JAR is downloaded at that version. When empty, the JAR is assumed to be pre-installed on the runner.'
        required: false
        type: string
        default: ''
    secrets:
      DBMAESTRO_PASSWORD:
        description: 'DBmaestro password or token'
        required: false

jobs:
  create_package:
    name: Create Package
    runs-on: ${{ inputs.runner }}
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJson(inputs.packages_matrix) }}
    steps:
      - name: Download DBmaestro CLI
        # If cli_version is set, download (or reuse cached) the JAR at that version.
        # If empty, the JAR is assumed to be pre-installed on the runner.
        if: ${{ inputs.cli_version != '' }}
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/get-cli-jar@v1
        with:
          version: ${{ inputs.cli_version }}
          jar-path: ${{ inputs.agent_jar_path }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create Package using Action
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/create-package@v1
        with:
          agent_jar_path: ${{ inputs.agent_jar_path }}
          auth_type: ${{ inputs.auth_type }}
          dbmaestro_password: ${{ secrets.DBMAESTRO_PASSWORD }}
          dbmaestro_server: ${{ inputs.dbmaestro_server }}
          dbmaestro_user: ${{ inputs.dbmaestro_user }}
          access_token_file_path: ${{ inputs.access_token_file_path }}
          package_name: ${{ matrix.item.package }}
          package_type: ${{ inputs.package_type }}
          packages_folder: ${{ inputs.packages_folder }}
          project_name: ${{ inputs.project_name }}
          use_ssl: ${{ inputs.use_ssl }}

  validate_package:
    name: Validate Package
    runs-on: ${{ inputs.runner }}
    needs: create_package
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJson(inputs.packages_matrix) }}
    steps:
      - name: Download DBmaestro CLI
        # If cli_version is set, download (or reuse cached) the JAR at that version.
        # If empty, the JAR is assumed to be pre-installed on the runner.
        if: ${{ inputs.cli_version != '' }}
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/get-cli-jar@v1
        with:
          version: ${{ inputs.cli_version }}
          jar-path: ${{ inputs.agent_jar_path }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Precheck Package using Action
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/precheck-package@v1
        with:
          agent_jar_path: ${{ inputs.agent_jar_path }}
          auth_type: ${{ inputs.auth_type }}
          dbmaestro_password: ${{ secrets.DBMAESTRO_PASSWORD }}
          dbmaestro_server: ${{ inputs.dbmaestro_server }}
          dbmaestro_user: ${{ inputs.dbmaestro_user }}
          access_token_file_path: ${{ inputs.access_token_file_path }}
          package_name: ${{ matrix.item.package }}
          project_name: ${{ inputs.project_name }}
          use_ssl: ${{ inputs.use_ssl }}

  tag_packages:
    name: Tag Packages
    runs-on: ${{ inputs.runner }}
    needs: validate_package
    if: ${{ inputs.tags != '' }}
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJson(inputs.packages_matrix) }}
    steps:
      - name: Download DBmaestro CLI
        # If cli_version is set, download (or reuse cached) the JAR at that version.
        # If empty, the JAR is assumed to be pre-installed on the runner.
        if: ${{ inputs.cli_version != '' }}
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/get-cli-jar@v1
        with:
          version: ${{ inputs.cli_version }}
          jar-path: ${{ inputs.agent_jar_path }}

      - name: Checkout dbmaestro-cicd
        uses: actions/checkout@v6
        with:
          repository: DBMaestroDev/dbmaestro-cicd
          ref: v1
          path: dbmaestro-cicd

      - name: Apply Tags
        shell: bash
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ matrix.item.package }}
          DBMAESTRO_TAG_TYPE_NAME: ${{ inputs.tag_type_name }}
          DBMAESTRO_PROJECT_NAME: ${{ inputs.project_name }}
          DBMAESTRO_AGENT_JAR: ${{ inputs.agent_jar_path }}
          DBMAESTRO_SERVER: ${{ inputs.dbmaestro_server }}
          DBMAESTRO_USER: ${{ inputs.dbmaestro_user }}
          DBMAESTRO_PASSWORD: ${{ secrets.DBMAESTRO_PASSWORD }}
          DBMAESTRO_ACCESS_TOKEN_FILE_PATH: ${{ inputs.access_token_file_path }}
          DBMAESTRO_USE_SSL: ${{ inputs.use_ssl }}
          DBMAESTRO_AUTH_TYPE: ${{ inputs.auth_type }}
        run: |
          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [ -z "$tag" ] && continue
            DBMAESTRO_TAG_NAME="$tag" bash "$GITHUB_WORKSPACE/dbmaestro-cicd/core/scripts/sh/tag-package.sh"
          done
