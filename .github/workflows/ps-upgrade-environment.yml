# Version: v1.10
# Reusable Workflow for Environment Upgrade
# Can be called from other workflows to upgrade environments
# Packages must be built and validated prior to upgrade

name: Upgrade Environment - ps (Reusable)

on:
  workflow_call:
    inputs:
      agent_jar_path:
        description: 'Path to DBmaestro Agent JAR file'
        required: false
        type: string
        default: '/home/runner/DBmaestroAgent.jar'
      auth_type:
        description: 'Authentication type'
        required: false
        type: string
        default: 'DBmaestroAccount'
      dbmaestro_server:
        description: 'DBmaestro server URL'
        required: true
        type: string
      dbmaestro_user:
        description: 'DBmaestro username'
        required: true
        type: string
      detect_from_push:
        description: 'Detect changed packages from git push (true/false)'
        required: false
        type: boolean
        default: false
      is_pull_request:
        description: 'Is this a pull request event (true/false)'
        required: false
        type: boolean
        default: false
      package_name:
        description: 'Package name list to upgrade (comma-separated for multiple packages)'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'Tag name to upgrade (use instead of package_name)'
        required: false
        type: string
        default: ''
      project_name:
        description: 'DBmaestro project name'
        required: false
        type: string
        default: 'Demo-PSQL'
      target_environment:
        description: 'Target environment for upgrade'
        required: true
        type: string
      use_ssl:
        description: 'Use SSL for DBmaestro connection'
        required: false
        type: string
        default: 'True'
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'dbmaestro-runner'
      cli_version:
        description: 'DBmaestro CLI version to download (e.g., "26.1.0.13224"). When set, the JAR is downloaded at that version. When empty, the JAR is assumed to be pre-installed on the runner.'
        required: false
        type: string
        default: ''
    secrets:
      DBMAESTRO_PASSWORD:
        required: true
    outputs:
      upgraded_packages:
        description: 'List of packages that were upgraded'
        value: ${{ jobs.detect_changed_packages.outputs.packages_list }}

env:
  GIT_DEPTH: 1

jobs:
  # Detect changed packages from push or workflow input
  detect_changed_packages:
    name: Detect Changed Packages
    runs-on: ${{ inputs.runner }}
    if: ${{ !inputs.is_pull_request }}
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_packages: ${{ steps.detect.outputs.has_packages }}
      packages_list: ${{ steps.detect.outputs.packages_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Changed Packages
        id: detect
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/ps/detect-changed-packages@v1
        with:
          package_name: ${{ inputs.package_name }}
          tag_name: ${{ inputs.tag_name }}
          detect_from_push: ${{ inputs.detect_from_push }}

  # Detect changed packages for pull requests
  detect_changed_packages_pr:
    name: Detect Changed Packages (Pull Request)
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.is_pull_request }}
    outputs:
      packages: ${{ steps.detect-pr.outputs.packages }}
      packages_list: ${{ steps.detect-pr.outputs.packages_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Changed Folders in packages/
        id: detect-pr
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/ps/detect-changed-packages@v1
        with:
          is_pull_request: true

  # Comment on PR with detected packages
  comment_pr:
    name: Comment PR with Detected Changed Packages
    runs-on: ${{ inputs.runner }}
    if: ${{ inputs.is_pull_request }}
    needs: detect_changed_packages_pr
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Post PR Comment
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/ps/pr-comment@v1
        with:
          packages_list: ${{ needs.detect_changed_packages_pr.outputs.packages_list }}
          environment_name: ${{ inputs.target_environment }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Upgrade environment with detected packages
  upgrade_environment:
    name: Upgrade Environment
    runs-on: ${{ inputs.runner }}
    needs: detect_changed_packages
    if: |
      !inputs.is_pull_request &&
      needs.detect_changed_packages.outputs.has_packages == 'true'
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJson(needs.detect_changed_packages.outputs.matrix) }}
    steps:
      - name: Download DBmaestro CLI
        # If cli_version is set, download (or reuse cached) the JAR at that version.
        # If empty, the JAR is assumed to be pre-installed on the runner.
        if: ${{ inputs.cli_version != '' }}
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/ps/get-cli-jar@v1
        with:
          version: ${{ inputs.cli_version }}
          jar-path: ${{ inputs.agent_jar_path }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Upgrade Package
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/ps/upgrade-environment@v1
        with:
          package_name: ${{ matrix.item.package }}
          tag_name: ${{ inputs.tag_name }}
          target_environment: ${{ inputs.target_environment }}
          project_name: ${{ inputs.project_name }}
          agent_jar_path: ${{ inputs.agent_jar_path }}
          use_ssl: ${{ inputs.use_ssl }}
          auth_type: ${{ inputs.auth_type }}
          dbmaestro_server: ${{ vars.DBMAESTRO_SERVER }}
          dbmaestro_user: ${{ vars.DBMAESTRO_USER }}
          DBMAESTRO_PASSWORD: ${{ secrets.DBMAESTRO_PASSWORD }}
