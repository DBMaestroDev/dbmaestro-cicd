# Example: Build with Direct Action Usage (no reusable workflow wrapper)
# Calls the composite actions directly for full control over the pipeline steps.
# Useful when you need to add custom steps between create and precheck.

name: Example - Build Direct Action Usage (Linux)

on:
  workflow_dispatch:
    inputs:
      package_names:
        description: 'Package names to build (comma-separated, e.g., V15,V16)'
        required: true
        type: string
      project_name:
        description: 'DBmaestro project name'
        required: true
        type: string
        default: 'Demo-PSQL'
      tags:
        description: 'Comma-separated tags to apply after build (optional, e.g., "TASK-123,TASK-456")'
        required: false
        type: string
        default: ''
      tag_type_name:
        description: 'Tag type name'
        required: false
        type: string
        default: 'Task'
env:
  AGENT_JAR: '/home/runner/DBmaestroAgent.jar'
  PACKAGES_FOLDER: 'packages'

jobs:
  prepare_matrix:
    name: Prepare Package Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      - name: Create Matrix from Input
        id: create-matrix
        shell: bash
        run: |
          IFS=',' read -ra PACKAGES <<< "${{ inputs.package_names }}"
          matrix="["
          first=true
          for pkg in "${PACKAGES[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            if [ -n "$pkg" ]; then
              [ "$first" = false ] && matrix="$matrix,"
              matrix="$matrix{\"package\":\"$pkg\"}"
              first=false
            fi
          done
          matrix="$matrix]"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build_packages:
    name: Build Package - ${{ matrix.item.package }}
    runs-on: dbmaestro-linux
    needs: prepare_matrix
    strategy:
      max-parallel: 1
      matrix:
        item: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}
    steps:
      - name: Download DBmaestro CLI
        # If CLI_VERSION repo variable is set, download the JAR. Leave empty if JAR is pre-installed.
        if: ${{ vars.CLI_VERSION != '' }}
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/get-cli-jar@v1
        with:
          version: ${{ vars.CLI_VERSION }}
          jar-path: ${{ env.AGENT_JAR }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create Package
        id: create
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/create-package@v1
        with:
          package_name: ${{ matrix.item.package }}
          project_name: ${{ inputs.project_name }}
          packages_folder: ${{ env.PACKAGES_FOLDER }}
          agent_jar_path: ${{ env.AGENT_JAR }}
          dbmaestro_server: ${{ vars.DBMAESTRO_SERVER }}
          use_ssl: 'True'
          auth_type: 'DBmaestroAccount'
          dbmaestro_user: ${{ vars.DBMAESTRO_USER }}
          dbmaestro_password: ${{ secrets.DBMAESTRO_PASSWORD }}
          package_type: 'Regular'

      - name: Precheck Package
        uses: DBMaestroDev/dbmaestro-cicd/.github/actions/sh/precheck-package@v1
        with:
          package_name: ${{ matrix.item.package }}
          project_name: ${{ inputs.project_name }}
          agent_jar_path: ${{ env.AGENT_JAR }}
          dbmaestro_server: ${{ vars.DBMAESTRO_SERVER }}
          use_ssl: 'True'
          auth_type: 'DBmaestroAccount'
          dbmaestro_user: ${{ vars.DBMAESTRO_USER }}
          dbmaestro_password: ${{ secrets.DBMAESTRO_PASSWORD }}

      - name: Apply Tags
        if: ${{ inputs.tags != '' }}
        shell: bash
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ matrix.item.package }}
          DBMAESTRO_TAG_TYPE_NAME: ${{ inputs.tag_type_name }}
          DBMAESTRO_PROJECT_NAME: ${{ inputs.project_name }}
          DBMAESTRO_AGENT_JAR: ${{ env.AGENT_JAR }}
          DBMAESTRO_SERVER: ${{ vars.DBMAESTRO_SERVER }}
          DBMAESTRO_USER: ${{ vars.DBMAESTRO_USER }}
          DBMAESTRO_PASSWORD: ${{ secrets.DBMAESTRO_PASSWORD }}
          DBMAESTRO_USE_SSL: 'True'
          DBMAESTRO_AUTH_TYPE: 'DBmaestroAccount'
        run: |
          IFS=',' read -ra TAGS <<< "${{ inputs.tags }}"
          for tag in "${TAGS[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [ -z "$tag" ] && continue
            DBMAESTRO_TAG_NAME="$tag" bash "$GITHUB_WORKSPACE/dbmaestro-cicd/core/scripts/sh/tag-package.sh"
          done
