# Example: Build with Branch Name as Package Name (Azure DevOps)
# Uses the current branch name (or PR source branch) as the package name.
resources:
  repositories:
    - repository: dbmaestro-cicd
      type: github
      name: DBMaestroDev/dbmaestro-cicd
      endpoint: dbmaestro-cicd  # Replace with your GitHub service connection name if different
      ref: refs/tags/v1

parameters:
  - name: projectName
    type: string
    default: 'Demo-PSQL'
  - name: packagesFolder
    type: string
    default: 'packages'
  - name: agentJarPath
    type: string
    default: '$(Pipeline.Workspace)/DBmaestroAgent.jar'
  - name: runnerPool
    type: string
    default: 'dbmaestro-linux'
  - name: tags
    displayName: 'Comma-separated tags to apply after build (optional, e.g., "TASK-123,TASK-456")'
    type: string
    default: ''
  - name: tagTypeName
    displayName: 'Tag type name'
    type: string
    default: 'Task'
trigger: none

pr:
  branches:
    include:
      - main
      - Release_Source

stages:
  - stage: Build
    displayName: 'Build Package from Branch Name'
    jobs:
      - job: CreateAndPrecheck
        displayName: 'Create and Precheck Package'
        pool: ${{ parameters.runnerPool }}
        variables:
          packageName: >-
            $[
              coalesce(
                variables['System.PullRequest.SourceBranch'],
                variables['Build.SourceBranchName']
              )
            ]
        steps:
          - checkout: self

          - checkout: dbmaestro-cicd
            fetchDepth: 1
            
          - bash: |
              if [ -n "$SYSTEM_PULLREQUEST_SOURCEBRANCH" ]; then
                # Strip refs/heads/ prefix if present
                PKG="${SYSTEM_PULLREQUEST_SOURCEBRANCH#refs/heads/}"
              else
                PKG="$BUILD_SOURCEBRANCHNAME"
              fi
              echo "Resolved package name: $PKG"
              echo "##vso[task.setvariable variable=resolvedPackageName]$PKG"
            displayName: 'Resolve Package Name from Branch'

          - template: azure-devops/templates/create-package.yml@dbmaestro-cicd
            parameters:
              packageName: $(resolvedPackageName)
              projectName: ${{ parameters.projectName }}
              packagesFolder: ${{ parameters.packagesFolder }}
              agentJarPath: ${{ parameters.agentJarPath }}
              server: $(DBMAESTRO_SERVER)
              user: $(DBMAESTRO_USER)
              password: $(DBMAESTRO_PASSWORD)
              useSsl: 'True'
              authType: 'DBmaestroAccount'
              packageType: 'Regular'
              useWindows: false
              # CLI_VERSION pipeline variable controls JAR download. Set in pipeline Variables or a Variable Group.
              # Leave empty if the JAR is pre-installed on the runner.
              version: $(CLI_VERSION)

          - template: azure-devops/templates/precheck-package.yml@dbmaestro-cicd
            parameters:
              packageName: $(resolvedPackageName)
              projectName: ${{ parameters.projectName }}
              agentJarPath: ${{ parameters.agentJarPath }}
              server: $(DBMAESTRO_SERVER)
              user: $(DBMAESTRO_USER)
              password: $(DBMAESTRO_PASSWORD)
              useSsl: 'True'
              authType: 'DBmaestroAccount'
              useWindows: false

          - ${{ if ne(parameters.tags, '') }}:
            - bash: |
                IFS=',' read -ra TAGS <<< "${{ parameters.tags }}"
                for tag in "${TAGS[@]}"; do
                  tag="$(echo "$tag" | xargs)"
                  [ -z "$tag" ] && continue
                  DBMAESTRO_TAG_NAME="$tag" bash "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/sh/tag-package.sh"
                done
              displayName: 'Tag Package'
              env:
                DBMAESTRO_PACKAGE_NAME: $(resolvedPackageName)
                DBMAESTRO_TAG_TYPE_NAME: ${{ parameters.tagTypeName }}
                DBMAESTRO_PROJECT_NAME: ${{ parameters.projectName }}
                DBMAESTRO_AGENT_JAR: ${{ parameters.agentJarPath }}
                DBMAESTRO_SERVER: $(DBMAESTRO_SERVER)
                DBMAESTRO_USER: $(DBMAESTRO_USER)
                DBMAESTRO_PASSWORD: $(DBMAESTRO_PASSWORD)
                DBMAESTRO_USE_SSL: 'True'
                DBMAESTRO_AUTH_TYPE: 'DBmaestroAccount'
