# Azure DevOps step template: build-from-source
# Builds a DBmaestro package from source control (Tasks or Specific Commit).
#
# Usage in your azure-pipelines.yml:
#
#   resources:
#     repositories:
#       - repository: dbmaestro-cicd
#         type: github
#         name: DBMaestroDev/dbmaestro-cicd
#         endpoint: github-dbmaestro
#         ref: v1
#
#   steps:
#     - checkout: self
#     - checkout: dbmaestro-cicd
#     - template: azure-devops/templates/build-from-source.yml@dbmaestro-cicd
#       parameters:
#         packageName: "MyPackage"
#         projectName: "MyProject"
#         envName: "Dev_Env_1"
#         versionType: "Tasks"
#         additionalInformation: "TASK-123,TASK-456"
#         agentJarPath: "/home/runner/DBmaestroAgent.jar"
#         server: "dbmaestro.example.com"
#         user: $(DBMAESTRO_USER)
#         password: $(DBMAESTRO_PASSWORD)
#         # accessTokenFilePath: $(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)  # alternative to user/password

parameters:
  - name: packageName
    type: string
  - name: projectName
    type: string
  - name: envName
    type: string
  - name: agentJarPath
    type: string
    default: "/home/runner/DBmaestroAgent.jar"
  - name: server
    type: string
  - name: user
    type: string
    default: ""
  - name: password
    type: string
    default: ""
  - name: accessTokenFilePath
    type: string
    default: ""
  - name: versionType
    type: string
    default: ""
  - name: additionalInformation
    type: string
    default: ""
  - name: useSsl
    type: string
    default: "True"
  - name: authType
    type: string
    default: "DBmaestroAccount"
  - name: createDowngradeScripts
    type: string
    default: "True"
  - name: useWindows
    type: boolean
    default: false
  - name: version
    type: string
    default: ""
  - name: tags
    type: string
    default: ""
  - name: tagTypeName
    type: string
    default: "Task"

steps:
  # If version is set, download (or reuse cached) the JAR. If empty, the JAR is assumed to be pre-installed on the runner.
  - ${{ if ne(parameters.version, '') }}:
      - template: get-cli-jar.yml@dbmaestro-cicd
        parameters:
          version: ${{ parameters.version }}
          jarPath: ${{ parameters.agentJarPath }}
          useWindows: ${{ parameters.useWindows }}

  - ${{ if not(parameters.useWindows) }}:
      - task: Bash@3
        displayName: "DBmaestro: Build Package '${{ parameters.packageName }}' from Source"
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ parameters.packageName }}
          DBMAESTRO_PROJECT_NAME: ${{ parameters.projectName }}
          DBMAESTRO_ENV_NAME: ${{ parameters.envName }}
          DBMAESTRO_AGENT_JAR: ${{ parameters.agentJarPath }}
          DBMAESTRO_SERVER: ${{ parameters.server }}
          DBMAESTRO_USER: ${{ parameters.user }}
          DBMAESTRO_PASSWORD: ${{ parameters.password }}
          DBMAESTRO_ACCESS_TOKEN_FILE_PATH: ${{ parameters.accessTokenFilePath }}
          DBMAESTRO_VERSION_TYPE: ${{ parameters.versionType }}
          DBMAESTRO_ADDITIONAL_INFORMATION: ${{ parameters.additionalInformation }}
          DBMAESTRO_USE_SSL: ${{ parameters.useSsl }}
          DBMAESTRO_AUTH_TYPE: ${{ parameters.authType }}
          DBMAESTRO_CREATE_DOWNGRADE_SCRIPTS: ${{ parameters.createDowngradeScripts }}
        inputs:
          targetType: filePath
          filePath: $(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/sh/build-from-source.sh

  - ${{ if parameters.useWindows }}:
      - task: PowerShell@2
        displayName: "DBmaestro: Build Package '${{ parameters.packageName }}' from Source (Windows)"
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ parameters.packageName }}
          DBMAESTRO_PROJECT_NAME: ${{ parameters.projectName }}
          DBMAESTRO_ENV_NAME: ${{ parameters.envName }}
          DBMAESTRO_AGENT_JAR: ${{ parameters.agentJarPath }}
          DBMAESTRO_SERVER: ${{ parameters.server }}
          DBMAESTRO_USER: ${{ parameters.user }}
          DBMAESTRO_PASSWORD: ${{ parameters.password }}
          DBMAESTRO_ACCESS_TOKEN_FILE_PATH: ${{ parameters.accessTokenFilePath }}
          DBMAESTRO_VERSION_TYPE: ${{ parameters.versionType }}
          DBMAESTRO_ADDITIONAL_INFORMATION: ${{ parameters.additionalInformation }}
          DBMAESTRO_USE_SSL: ${{ parameters.useSsl }}
          DBMAESTRO_AUTH_TYPE: ${{ parameters.authType }}
          DBMAESTRO_CREATE_DOWNGRADE_SCRIPTS: ${{ parameters.createDowngradeScripts }}
        inputs:
          targetType: filePath
          filePath: $(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/ps/build-from-source.ps1
          pwsh: true

  - ${{ if and(not(parameters.useWindows), ne(parameters.tags, ''), ne(parameters.tags, 'none')) }}:
      - task: Bash@3
        displayName: "DBmaestro: Tag Package '${{ parameters.packageName }}'"
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ parameters.packageName }}
          DBMAESTRO_TAG_TYPE_NAME: ${{ parameters.tagTypeName }}
          DBMAESTRO_PROJECT_NAME: ${{ parameters.projectName }}
          DBMAESTRO_AGENT_JAR: ${{ parameters.agentJarPath }}
          DBMAESTRO_SERVER: ${{ parameters.server }}
          DBMAESTRO_USER: ${{ parameters.user }}
          DBMAESTRO_PASSWORD: ${{ parameters.password }}
          DBMAESTRO_ACCESS_TOKEN_FILE_PATH: ${{ parameters.accessTokenFilePath }}
          DBMAESTRO_USE_SSL: ${{ parameters.useSsl }}
          DBMAESTRO_AUTH_TYPE: ${{ parameters.authType }}
        inputs:
          targetType: inline
          script: |
            IFS=',' read -ra TAGS <<< "${{ parameters.tags }}"
            for tag in "${TAGS[@]}"; do
              tag="$(echo "$tag" | xargs)"
              [ -z "$tag" ] && continue
              DBMAESTRO_TAG_NAME="$tag" bash "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/sh/tag-package.sh"
            done

  - ${{ if and(parameters.useWindows, ne(parameters.tags, ''), ne(parameters.tags, 'none')) }}:
      - task: PowerShell@2
        displayName: "DBmaestro: Tag Package '${{ parameters.packageName }}' (Windows)"
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ parameters.packageName }}
          DBMAESTRO_TAG_TYPE_NAME: ${{ parameters.tagTypeName }}
          DBMAESTRO_PROJECT_NAME: ${{ parameters.projectName }}
          DBMAESTRO_AGENT_JAR: ${{ parameters.agentJarPath }}
          DBMAESTRO_SERVER: ${{ parameters.server }}
          DBMAESTRO_USER: ${{ parameters.user }}
          DBMAESTRO_PASSWORD: ${{ parameters.password }}
          DBMAESTRO_ACCESS_TOKEN_FILE_PATH: ${{ parameters.accessTokenFilePath }}
          DBMAESTRO_USE_SSL: ${{ parameters.useSsl }}
          DBMAESTRO_AUTH_TYPE: ${{ parameters.authType }}
        inputs:
          targetType: inline
          script: |
            $tags = "${{ parameters.tags }}" -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            foreach ($tag in $tags) {
              $env:DBMAESTRO_TAG_NAME = $tag
              & "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/ps/tag-package.ps1"
            }
          pwsh: true
