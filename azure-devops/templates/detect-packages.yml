# Azure DevOps step template: detect-packages
# Detects changed DBmaestro packages from git diff, push, or manual input.
# Outputs are set as pipeline variables: has_packages, packages_list, matrix, packages
#
# Usage in your azure-pipelines.yml:
#
#   resources:
#     repositories:
#       - repository: dbmaestro-cicd
#         type: github
#         name: DBMaestroDev/dbmaestro-cicd
#         endpoint: github-dbmaestro
#         ref: v1
#
#   steps:
#     - checkout: self
#     - checkout: dbmaestro-cicd
#     - template: azure-devops/templates/detect-packages.yml@dbmaestro-cicd
#       parameters:
#         detectFromPush: true

parameters:
  - name: isPullRequest
    type: string
    default: "false"
  - name: baseRef
    type: string
    default: ""
  - name: detectFromPush
    type: boolean
    default: false
  - name: packageName
    type: string
    default: ""
  - name: tagName
    type: string
    default: ""
  - name: useWindows
    type: boolean
    default: false

steps:
  - ${{ if not(parameters.useWindows) }}:
      - task: Bash@3
        displayName: "DBmaestro: Detect Changed Packages"
        name: detectPackages
        env:
          DETECT_IS_PULL_REQUEST: ${{ parameters.isPullRequest }}
          DETECT_BASE_REF: ${{ parameters.baseRef }}
          DETECT_FROM_PUSH: ${{ lower(format('{0}', parameters.detectFromPush)) }}
          DETECT_PACKAGE_NAME: ${{ parameters.packageName }}
          DETECT_TAG_NAME: ${{ parameters.tagName }}
        inputs:
          targetType: inline
          script: |
            cd "$(Build.SourcesDirectory)"
            export DBM_OUTPUT_FILE="$(Pipeline.Workspace)/dbm-packages.env"
            # Fetch the base ref branch to ensure it's available for git diff comparison.
            # Shallow clones only fetch the current branch, so we need to explicitly fetch
            # the base branch to compare against when detecting package changes.
            if [ -n "$DETECT_BASE_REF" ]; then
              git fetch origin "$DETECT_BASE_REF" 2>/dev/null || true
            fi
            bash "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/sh/detect-packages.sh"
            # Promote outputs as pipeline variables and save to workspace
            if [ -f "$DBM_OUTPUT_FILE" ]; then
              while IFS='=' read -r key value; do
                echo "##vso[task.setvariable variable=${key};isOutput=true]${value}"
              done < "$DBM_OUTPUT_FILE"
            fi

  - ${{ if parameters.useWindows }}:
      - task: PowerShell@2
        displayName: "DBmaestro: Detect Changed Packages (Windows)"
        name: detectPackages
        env:
          DETECT_IS_PULL_REQUEST: ${{ parameters.isPullRequest }}
          DETECT_BASE_REF: ${{ parameters.baseRef }}
          DETECT_FROM_PUSH: ${{ lower(format('{0}', parameters.detectFromPush)) }}
          DETECT_PACKAGE_NAME: ${{ parameters.packageName }}
          DETECT_TAG_NAME: ${{ parameters.tagName }}
        inputs:
          targetType: inline
          pwsh: true
          script: |
            Set-Location "$(Build.SourcesDirectory)"
            $env:DBM_OUTPUT_FILE = "$(Agent.TempDirectory)\dbm-output.env"
            # Fetch the base ref branch to ensure it's available for git diff comparison.
            # Shallow clones only fetch the current branch, so we need to explicitly fetch
            # the base branch to compare against when detecting package changes.
            if ($env:DETECT_BASE_REF) {
              git fetch origin $env:DETECT_BASE_REF 2>$null
            }
            & "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/ps/detect-packages.ps1"
            # Promote outputs as pipeline variables
            foreach ($line in (Get-Content "$env:DBM_OUTPUT_FILE")) {
              $parts = $line -split '=', 2
              if ($parts.Count -eq 2) {
                Write-Host "##vso[task.setvariable variable=$($parts[0]);isOutput=true]$($parts[1])"
              }
            }
