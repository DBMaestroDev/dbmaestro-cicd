# Azure DevOps job template: build-multiple-packages
# Creates and validates multiple DBmaestro packages from a comma-separated list.
# Processes packages sequentially: creates each package, then prechecks it.
#
# Usage in your azure-pipelines.yml:
#
#   jobs:
#     - template: azure-devops/templates/build-multiple-packages.yml@dbmaestro-cicd
#       parameters:
#         packageNames: "V1,V2,V3"
#         projectName: "MyProject"
#         agentJarPath: "/home/runner/DBmaestroAgent.jar"
#         server: "dbmaestro.example.com"
#         user: $(DBMAESTRO_USER)
#         password: $(DBMAESTRO_PASSWORD)
#         # accessTokenFilePath: $(DBMAESTRO_ACCESS_TOKEN_FILE_PATH)  # alternative to user/password

parameters:
  - name: packageNames
    type: string
    displayName: 'Comma-separated package names (e.g., "V1,V2,V3")'
  - name: projectName
    type: string
  - name: packagesFolder
    type: string
    default: "packages"
  - name: agentJarPath
    type: string
    default: "$(Pipeline.Workspace)/DBmaestroAgent.jar"
  - name: server
    type: string
  - name: user
    type: string
    default: ""
  - name: password
    type: string
    default: ""
  - name: accessTokenFilePath
    type: string
    default: ""
  - name: useSsl
    type: string
    default: "True"
  - name: authType
    type: string
    default: "DBmaestroAccount"
  - name: packageType
    type: string
    default: "Regular"
  - name: ignoreWarnings
    type: string
    default: "True"
  - name: pool
    type: object
    default: null
  - name: runnerPool
    type: string
    default: 'dbmaestro-linux'
  - name: useWindows
    type: boolean
    default: false
  - name: version
    type: string
    default: ""
  - name: tags
    type: string
    default: ""
  - name: tagTypeName
    type: string
    default: "Task"

jobs:
  - job: BuildMultiplePackages
    displayName: 'Create and Validate Packages'
    ${{ if parameters.pool }}:
      pool: ${{ parameters.pool }}
    ${{ else }}:
      pool:
        name: ${{ parameters.runnerPool }}
    steps:
      - checkout: self
        fetchDepth: 1

      - checkout: dbmaestro-cicd
        fetchDepth: 1

      # If version is set, download (or reuse cached) the JAR. If empty, the JAR is assumed to be pre-installed on the runner.
      - ${{ if ne(parameters.version, '') }}:
        - template: get-cli-jar.yml@dbmaestro-cicd
          parameters:
            version: ${{ parameters.version }}
            jarPath: ${{ parameters.agentJarPath }}
            useWindows: ${{ parameters.useWindows }}

      - bash: |
          # If packageNames is empty, try to read from detection file
          PKG_LIST="${{ parameters.packageNames }}"
          if [ -z "$PKG_LIST" ] && [ -f "$(Pipeline.Workspace)/dbm-packages.env" ]; then
            source "$(Pipeline.Workspace)/dbm-packages.env"
            PKG_LIST="$packages_list"
          fi
          if [ -z "$PKG_LIST" ]; then
            echo "##[section]No packages specified or detected"
            exit 0
          fi
          echo "##vso[task.setvariable variable=RESOLVED_PACKAGE_NAMES]$PKG_LIST"
        displayName: 'Resolve Package Names'

      - bash: |
          IFS=',' read -ra PACKAGES <<< "$(RESOLVED_PACKAGE_NAMES)"
          PKG_COUNT=${#PACKAGES[@]}
          
          for i in "${!PACKAGES[@]}"; do
            PKG="${PACKAGES[$i]}"
            PKG=$(echo "$PKG" | xargs)
            [ -z "$PKG" ] && continue
            
            PKG_NUM=$((i+1))
            echo "##[group]=== Package $PKG_NUM/$PKG_COUNT: Creating $PKG ==="
            
            # Set environment for create-package
            export DBMAESTRO_PACKAGE_NAME="$PKG"
            export DBMAESTRO_PROJECT_NAME="${{ parameters.projectName }}"
            export DBMAESTRO_PACKAGES_FOLDER="${{ parameters.packagesFolder }}"
            export DBMAESTRO_AGENT_JAR="${{ parameters.agentJarPath }}"
            export DBMAESTRO_SERVER="${{ parameters.server }}"
            export DBMAESTRO_USER="${{ parameters.user }}"
            export DBMAESTRO_PASSWORD="${{ parameters.password }}"
            export DBMAESTRO_ACCESS_TOKEN_FILE_PATH="${{ parameters.accessTokenFilePath }}"
            export DBMAESTRO_USE_SSL="${{ parameters.useSsl }}"
            export DBMAESTRO_AUTH_TYPE="${{ parameters.authType }}"
            export DBMAESTRO_PACKAGE_TYPE="${{ parameters.packageType }}"
            export DBMAESTRO_IGNORE_WARNINGS="${{ parameters.ignoreWarnings }}"
            
            # Invoke the create-package script
            if [ "${{ parameters.useWindows }}" = "False" ]; then
              bash "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/sh/create-package.sh" || exit 1
            else
              pwsh -Command "& '$(Build.SourcesDirectory)\dbmaestro-cicd\core\scripts\ps\create-package.ps1'" -ErrorAction Stop
            fi
            echo "##[endgroup]"
            
            echo "##[group]=== Package $PKG_NUM/$PKG_COUNT: Prechecking $PKG ==="
            
            # Set environment for precheck-package
            export DBMAESTRO_PACKAGE_NAME="$PKG"
            export DBMAESTRO_PROJECT_NAME="${{ parameters.projectName }}"
            export DBMAESTRO_AGENT_JAR="${{ parameters.agentJarPath }}"
            export DBMAESTRO_SERVER="${{ parameters.server }}"
            export DBMAESTRO_USER="${{ parameters.user }}"
            export DBMAESTRO_PASSWORD="${{ parameters.password }}"
            export DBMAESTRO_ACCESS_TOKEN_FILE_PATH="${{ parameters.accessTokenFilePath }}"
            export DBMAESTRO_USE_SSL="${{ parameters.useSsl }}"
            export DBMAESTRO_AUTH_TYPE="${{ parameters.authType }}"

            # Invoke the precheck-package script
            if [ "${{ parameters.useWindows }}" = "False" ]; then
              bash "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/sh/precheck-package.sh" || exit 1
            else
              pwsh -Command "& '$(Build.SourcesDirectory)\dbmaestro-cicd\core\scripts\ps\precheck-package.ps1'" -ErrorAction Stop
            fi
            echo "##[endgroup]"

            if [ -n "${{ parameters.tags }}" ] && [ "${{ parameters.tags }}" != "none" ]; then
              echo "##[group]=== Package $PKG_NUM/$PKG_COUNT: Tagging $PKG ==="
              IFS=',' read -ra TAGS <<< "${{ parameters.tags }}"
              for tag in "${TAGS[@]}"; do
                tag="$(echo "$tag" | xargs)"
                [ -z "$tag" ] && continue
                export DBMAESTRO_TAG_NAME="$tag"
                export DBMAESTRO_TAG_TYPE_NAME="${{ parameters.tagTypeName }}"
                if [ "${{ parameters.useWindows }}" = "False" ]; then
                  bash "$(Build.SourcesDirectory)/dbmaestro-cicd/core/scripts/sh/tag-package.sh" || exit 1
                else
                  pwsh -Command "& '$(Build.SourcesDirectory)\dbmaestro-cicd\core\scripts\ps\tag-package.ps1'" -ErrorAction Stop
                fi
              done
              echo "##[endgroup]"
            fi
          done
        displayName: 'Create and Precheck Packages Sequentially'
        workingDirectory: $(Build.SourcesDirectory)
        env:
          DBMAESTRO_PASSWORD: ${{ parameters.password }}
