# Azure DevOps step template: tag-package
# Adds a tag to a DBmaestro package.
#
# Usage in your azure-pipelines.yml:
#
#   steps:
#     - template: azure-devops/templates/tag-package.yml@dbmaestro-cicd
#       parameters:
#         packageName: "MyPackage"
#         tagName: "TASK-123"
#         projectName: "MyProject"
#         agentJarPath: "/home/runner/DBmaestroAgent.jar"
#         server: "dbmaestro.example.com"
#         user: $(DBMAESTRO_USER)
#         password: $(DBMAESTRO_PASSWORD)

parameters:
  - name: packageName
    type: string
  - name: tagName
    type: string
  - name: tagTypeName
    type: string
    default: "Task"
  - name: projectName
    type: string
  - name: agentJarPath
    type: string
    default: "/home/runner/DBmaestroAgent.jar"
  - name: server
    type: string
  - name: user
    type: string
  - name: password
    type: string
  - name: useSsl
    type: string
    default: "True"
  - name: authType
    type: string
    default: "DBmaestroAccount"
  - name: useWindows
    type: boolean
    default: false
  - name: version
    type: string
    default: ""

steps:
  # If version is set, download (or reuse cached) the JAR. If empty, the JAR is assumed to be pre-installed on the runner.
  - ${{ if ne(parameters.version, '') }}:
      - template: get-cli-jar.yml@dbmaestro-cicd
        parameters:
          version: ${{ parameters.version }}
          jarPath: ${{ parameters.agentJarPath }}
          useWindows: ${{ parameters.useWindows }}

  - ${{ if not(parameters.useWindows) }}:
      - task: Bash@3
        displayName: "DBmaestro: Tag '${{ parameters.packageName }}' with '${{ parameters.tagName }}'"
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ parameters.packageName }}
          DBMAESTRO_TAG_TYPE_NAME: ${{ parameters.tagTypeName }}
          DBMAESTRO_TAG_NAME: ${{ parameters.tagName }}
          DBMAESTRO_PROJECT_NAME: ${{ parameters.projectName }}
          DBMAESTRO_AGENT_JAR: ${{ parameters.agentJarPath }}
          DBMAESTRO_SERVER: ${{ parameters.server }}
          DBMAESTRO_USER: ${{ parameters.user }}
          DBMAESTRO_PASSWORD: ${{ parameters.password }}
          DBMAESTRO_USE_SSL: ${{ parameters.useSsl }}
          DBMAESTRO_AUTH_TYPE: ${{ parameters.authType }}
        inputs:
          targetType: filePath
          filePath: $(Build.SourcesDirectory)/core/scripts/sh/tag-package.sh

  - ${{ if parameters.useWindows }}:
      - task: PowerShell@2
        displayName: "DBmaestro: Tag '${{ parameters.packageName }}' with '${{ parameters.tagName }}' (Windows)"
        env:
          DBMAESTRO_PACKAGE_NAME: ${{ parameters.packageName }}
          DBMAESTRO_TAG_TYPE_NAME: ${{ parameters.tagTypeName }}
          DBMAESTRO_TAG_NAME: ${{ parameters.tagName }}
          DBMAESTRO_PROJECT_NAME: ${{ parameters.projectName }}
          DBMAESTRO_AGENT_JAR: ${{ parameters.agentJarPath }}
          DBMAESTRO_SERVER: ${{ parameters.server }}
          DBMAESTRO_USER: ${{ parameters.user }}
          DBMAESTRO_PASSWORD: ${{ parameters.password }}
          DBMAESTRO_USE_SSL: ${{ parameters.useSsl }}
          DBMAESTRO_AUTH_TYPE: ${{ parameters.authType }}
        inputs:
          targetType: filePath
          filePath: $(Build.SourcesDirectory)/core/scripts/ps/tag-package.ps1
          pwsh: true
